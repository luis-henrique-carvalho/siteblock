<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site bloqueado — SiteBlock</title>
    <style>
      :root {
        color: #eee9dc;
        background: #101613;
        font-family: ui-monospace, monospace;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 80% 5%, #20482f, transparent 32rem), #101613;
      }
      main {
        width: min(560px, calc(100% - 48px));
        border: 1px solid #caff5c;
        padding: 42px;
        background: #151b17;
      }
      p {
        color: #adb8aa;
        line-height: 1.6;
      }
      strong {
        color: #caff5c;
      }
      h1 {
        font:
          400 clamp(36px, 7vw, 56px) Georgia,
          serif;
        margin: 12px 0;
        letter-spacing: -0.06em;
      }
      small {
        color: #829080;
        letter-spacing: 0.12em;
      }
    </style>
  </head>
  <body>
    <main>
      <small>SITEBLOCK / FOCO ATIVO</small>
      <h1>Este destino está em pausa.</h1>
      <p>
        <strong id="domain"></strong> foi bloqueado pela regra atual. Volte quando sua janela de
        foco terminar.
      </p>
    </main>
    <script>
      document.querySelector("#domain").textContent =
        new URLSearchParams(location.search).get("domain") || "Este site";
    </script>
  </body>
</html>
